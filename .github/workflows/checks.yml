name: Website checks

# Cloudflare Workers Builds deploys the site: a preview for every branch and
# production from main. This workflow only checks each change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check pages and run Worker tests
        run: npm run check
      - name: Fail if site/dist is stale
        run: git diff --exit-code -- site/dist
      - name: Build the Worker as Cloudflare will
        run: npx cf deploy --mode production --dry-run
        env:
          CF_SEND_TELEMETRY: "false"
