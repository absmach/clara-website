name: Website checks

# Cloudflare Workers Builds deploys the site: a preview for every branch and
# production from main. This workflow only checks each change.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, check and dry-run the deploy as Cloudflare will
        run: pnpm exec cf deploy --mode production --dry-run
        env:
          CF_SEND_TELEMETRY: "false"
