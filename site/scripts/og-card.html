<!doctype html>
<!-- Social share card template. Rendered to src/assets/og-image.png by scripts/og-image.mjs.
     The HERO_ART placeholder below is replaced with the homepage's hero illustration from dist/index.html. -->
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="/styles.css"/>
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(ellipse at 90% 30%,#ffd7c482 0%,transparent 48%),radial-gradient(ellipse at 55% 90%,#f3d2ff77,transparent 50%),#fffcf7}
  .og{position:relative;display:grid;grid-template-columns:560px 640px;height:630px}
  .og-copy{display:flex;flex-direction:column;padding:58px 0 54px 72px}
  .og .brand{font-size:34px;font-weight:700;letter-spacing:-.04em;gap:12px;color:var(--ink)}
  .og .brand img{width:44px;height:44px}
  .og h1{margin:auto 0 0;font-size:82px;line-height:.98;letter-spacing:-.065em;font-weight:500;color:var(--ink)}
  .og h1 em{display:block;margin-top:.12em;color:#6542e9;font-size:1.08em;line-height:1.02}
  .og-foot{margin-top:34px;display:flex;align-items:center;gap:10px;font-size:20px;color:var(--muted)}
  .og-foot .tiny-mark{color:var(--coral)}
  .og-art{position:relative}
  .og-art .hero-art{position:absolute;top:30px;left:20px;width:600px;margin:0;transform:scale(.98);transform-origin:0 0}
  .og-art .art-caption{display:none}
</style></head>
<body><div class="og">
  <div class="og-copy">
    <span class="brand"><img src="/assets/clara-bloom.svg" alt=""/><span>Clara</span></span>
    <h1>You make<br/>great things.<em>Let’s tell<br/>the world.</em></h1>
    <p class="og-foot"><span class="tiny-mark">✳</span> Your AI marketing team · claragtm.com</p>
  </div>
  <div class="og-art">{{HERO_ART}}</div>
</div></body></html>
