<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300"><title>Assistant, Co-pilot, and Autopilot offer different levels of delegation, with approval and pause controls.</title><g font-family="Inter, Arial, sans-serif"><path d="M39 65H301" fill="none" stroke="#cfc4e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="39" cy="65" r="10" fill="#fffcf7"/><circle cx="39" cy="65" r="4" fill="#5b4fe8"/><circle cx="170" cy="65" r="10" fill="#fffcf7"/><circle cx="170" cy="65" r="4" fill="#5b4fe8"/><circle cx="301" cy="65" r="10" fill="#fffcf7"/><circle cx="301" cy="65" r="4" fill="#5b4fe8"/><text x="39" y="100" font-size="11" fill="#383143" font-weight="500" text-anchor="middle">Assistant</text><text x="170" y="100" font-size="11" fill="#383143" font-weight="500" text-anchor="middle">Co-pilot</text><text x="301" y="100" font-size="11" fill="#383143" font-weight="500" text-anchor="middle">Autopilot</text><rect x="32" y="142" width="276" height="111" rx="14" fill="#f0e9ff" stroke="#cfc4e9" stroke-width="1.4"/><text x="53" y="170" font-size="10" fill="#5b4fe8" font-weight="650" text-anchor="start">YOUR RULES STILL APPLY</text><path d="M54 191l4 4 8-9" fill="none" stroke="#5b4fe8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="196" font-size="12" fill="#383143" font-weight="500" text-anchor="start">Approval where you need it</text><path d="M54 220l4 4 8-9" fill="none" stroke="#5b4fe8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="225" font-size="12" fill="#383143" font-weight="500" text-anchor="start">Pause whenever you choose</text><text x="170" y="282" font-size="12" fill="#777083" font-weight="500" text-anchor="middle">Choose how much to delegate.</text></g></svg>
